<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Office Ready</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #17221f;
      background: #eaf2ed;
    }

    .game {
      width: min(100%, 650px);
      padding: 32px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px #173d3020;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #557067;
      font-size: 14px;
      font-weight: bold;
    }

    h1 { margin: 12px 0 6px; font-size: 32px; }

    .intro {
      margin: 0 0 24px;
      color: #5c6b65;
      line-height: 1.5;
    }

    .progress-track {
      height: 9px;
      margin: 18px 0 28px;
      overflow: hidden;
      border-radius: 99px;
      background: #e5ece8;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #21a67a;
      transition: width 0.3s;
    }

    .tag {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 99px;
      color: #147555;
      background: #e4f6ee;
      font-size: 13px;
      font-weight: bold;
    }

    h2 {
      margin: 16px 0 20px;
      font-size: 23px;
      line-height: 1.35;
    }

    .choices { display: grid; gap: 11px; }

    .choice {
      width: 100%;
      padding: 15px 16px;
      border: 2px solid #e3eae6;
      border-radius: 14px;
      background: #fff;
      color: #17221f;
      text-align: left;
      font-size: 16px;
      line-height: 1.4;
      cursor: pointer;
    }

    .choice:hover:not(:disabled) {
      border-color: #21a67a;
      background: #f5fcf8;
    }

    .choice:disabled { cursor: default; }
    .choice.correct { border-color: #21a67a; background: #e8f8ef; }
    .choice.wrong { border-color: #e28a76; background: #fff0ec; }

    .feedback {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 14px;
      background: #f1f6f3;
      line-height: 1.5;
    }

    .feedback.show { display: block; }

    .next, .restart {
      margin-top: 18px;
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: #147555;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .next:hover, .restart:hover { background: #0e6145; }

    .result { padding: 20px 0; text-align: center; }

    .result .big-score {
      margin: 18px 0;
      color: #147555;
      font-size: 42px;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .game { padding: 23px; }
      h1 { font-size: 28px; }
      h2 { font-size: 20px; }
    }
  </style>
</head>

<body>
  <main class="game">
    <div class="topline">
      <span>🎯 OFFICE READY</span>
      <span id="scoreLabel">Score: 0</span>
    </div>

    <h1>Workplace Challenge</h1>
    <p class="intro">
      Try real-life work situations. Choose what you’d do, then learn from the feedback.
    </p>

    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <section id="gameArea"></section>
  </main>

  <script>
    const questionBank = [
      // Communication (1–10)
      {category:"Communication",question:"Your manager gives you a task, but the instructions are unclear. What do you do?",best:"Ask a few clear questions about the goal and deadline."},
      {category:"Communication",question:"You aren't sure which of two deadlines is more urgent. What do you do?",best:"Tell your manager what you're working on and ask which deadline comes first."},
      {category:"Communication",question:"You are blocked because you need information from someone. What do you do?",best:"Let them know what you need and explain how it affects your work."},
      {category:"Communication",question:"You disagree with a coworker's suggestion. What do you do?",best:"Explain your concern respectfully and listen to their reasoning."},
      {category:"Communication",question:"Someone gives you another task while you already have several due. What do you do?",best:"Share your current priorities and ask which task to prioritize."},
      {category:"Communication",question:"You missed one detail in a meeting. What do you do?",best:"Ask a polite follow-up question to confirm the detail."},
      {category:"Communication",question:"A coworker hasn't replied to a message you need answered. What do you do?",best:"Send a polite follow-up and explain when you need the answer."},
      {category:"Communication",question:"You realize your work will be late. What do you do?",best:"Tell the relevant person early, explain the delay, and give a realistic new time."},
      {category:"Communication",question:"You receive instructions and want to make sure you understood them. What do you do?",best:"Briefly repeat your understanding and ask if you got it right."},
      {category:"Communication",question:"You have bad news about a project. What do you do?",best:"Share the facts promptly and suggest possible next steps."},

      // Teamwork (11–20)
      {category:"Teamwork",question:"You finish your part of a shared project and notice a teammate is busy. What do you do?",best:"Ask whether there's a specific task you can help with."},
      {category:"Teamwork",question:"A teammate makes a small mistake that affects your work. What do you do?",best:"Speak with them respectfully and work together to correct it."},
      {category:"Teamwork",question:"A shared task is still unfinished near the deadline. What do you do?",best:"Check in with the team, clarify what remains, and agree on who will do it."},
      {category:"Teamwork",question:"A teammate disagrees with your idea. What do you do?",best:"Ask about their concerns and compare both ideas against the project goal."},
      {category:"Teamwork",question:"You want to help a coworker who seems overwhelmed. What do you do?",best:"Ask if they would like help and what task would be useful."},
      {category:"Teamwork",question:"A teammate hasn't sent you information needed for your part. What do you do?",best:"Contact them politely, explain what you need, and agree on a handoff time."},
      {category:"Teamwork",question:"Your team succeeds, and someone praises only you. What do you do?",best:"Thank them and recognize the teammates who contributed."},
      {category:"Teamwork",question:"You are stuck and your teammates may know the answer. What do you do?",best:"Explain what you've tried and ask a focused question."},
      {category:"Teamwork",question:"A coworker is handling several tasks at once. What do you do?",best:"Ask what support would help instead of taking over without asking."},
      {category:"Teamwork",question:"You are handing a task to a teammate at the end of your shift. What do you do?",best:"Share the current status, key details, and the next action clearly."},

      // Time management (21–30)
      {category:"Time management",question:"You have two tasks due today and may not finish both. What do you do?",best:"Raise the issue early and ask which task should come first."},
      {category:"Time management",question:"A task is taking longer than you expected. What do you do?",best:"Review what remains and update your manager with a realistic completion time."},
      {category:"Time management",question:"An urgent task arrives while you are working on something else. What do you do?",best:"Ask how urgent it is and confirm whether your current task should pause."},
      {category:"Time management",question:"A large task feels difficult to start. What do you do?",best:"Break it into smaller steps and begin with the first one."},
      {category:"Time management",question:"You finish your assigned work earlier than expected. What do you do?",best:"Check your work, then ask what useful task you should take on next."},
      {category:"Time management",question:"You are asked how long a task will take, but you aren't sure. What do you do?",best:"Give a careful estimate and mention what could affect the timing."},
      {category:"Time management",question:"You have several tasks to remember this week. What do you do?",best:"Write them down, note their deadlines, and review priorities each day."},
      {category:"Time management",question:"You keep getting interrupted while doing focused work. What do you do?",best:"Let people know when you'll be available and protect time for the task."},
      {category:"Time management",question:"A task has a deadline, but no one has said when to send a draft. What do you do?",best:"Ask whether an earlier draft or progress check is expected."},
      {category:"Time management",question:"You may miss a scheduled check-in because of another task. What do you do?",best:"Tell the organizer as soon as possible and ask to reschedule or share an update."},

      // Problem-solving (31–40)
      {category:"Problem-solving",question:"You find a mistake in a report you already sent. What do you do?",best:"Tell the relevant person, explain the correction, and send an updated report."},
      {category:"Problem-solving",question:"A tool you need suddenly stops working. What do you do?",best:"Check basic troubleshooting steps, then report the problem with useful details."},
      {category:"Problem-solving",question:"You don't know the answer to a customer's question. What do you do?",best:"Say you'll check, find the right information, and follow up."},
      {category:"Problem-solving",question:"You spot a problem but aren't sure what caused it. What do you do?",best:"Gather the facts and ask the right person before deciding on a fix."},
      {category:"Problem-solving",question:"A process keeps causing the same small delay. What do you do?",best:"Describe the pattern and suggest a practical improvement to your manager."},
      {category:"Problem-solving",question:"You try a solution, but it doesn't work. What do you do?",best:"Share what you tried, note the result, and decide on the next step."},
      {category:"Problem-solving",question:"You notice two files have conflicting information. What do you do?",best:"Check which source is current and confirm the correct information with its owner."},
      {category:"Problem-solving",question:"You are asked to solve a problem but don't have enough information. What do you do?",best:"List the missing information and ask focused questions to get it."},
      {category:"Problem-solving",question:"A small issue could affect a deadline if ignored. What do you do?",best:"Raise it early and explain the possible impact and a suggested solution."},
      {category:"Problem-solving",question:"You need to choose between a quick fix and a reliable fix. What do you do?",best:"Check the risks and ask which option best meets the team's needs."},

      // Feedback (41–50)
      {category:"Feedback",question:"Your manager gives you feedback on your work. What do you do?",best:"Listen, ask questions if needed, and identify what to improve next time."},
      {category:"Feedback",question:"You don't understand one part of feedback you received. What do you do?",best:"Ask for a specific example so you know what to change."},
      {category:"Feedback",question:"You receive feedback that surprises you. What do you do?",best:"Listen fully and take time to consider it before responding."},
      {category:"Feedback",question:"A coworker asks for feedback on their draft. What do you do?",best:"Share specific, respectful comments about what works and what could improve."},
      {category:"Feedback",question:"You have improved after receiving feedback. What do you do?",best:"Apply the improvement and, when useful, let the person know what you changed."},
      {category:"Feedback",question:"You disagree with feedback about your work. What do you do?",best:"Ask for examples and explain your view respectfully."},
      {category:"Feedback",question:"Your manager says a task needs revision but gives no details. What do you do?",best:"Ask which parts need revision and what a successful result should include."},
      {category:"Feedback",question:"You notice the same feedback coming up more than once. What do you do?",best:"Make a plan to practice that skill and check your progress."},
      {category:"Feedback",question:"You want feedback before submitting important work. What do you do?",best:"Ask for a review early enough to make changes."},
      {category:"Feedback",question:"A teammate gives you feedback in a rushed tone. What do you do?",best:"Focus on the useful information and ask calmly if anything is unclear."},

      // Customer service (51–60)
      {category:"Customer service",question:"A customer is upset because something went wrong. What do you do first?",best:"Listen calmly, acknowledge the problem, and ask how you can help."},
      {category:"Customer service",question:"A customer asks for something you aren't authorized to promise. What do you do?",best:"Explain what you can do and check with the right person before promising more."},
      {category:"Customer service",question:"A customer says they already explained the issue to someone else. What do you do?",best:"Apologize for the repeated effort and ask them to briefly confirm the key details."},
      {category:"Customer service",question:"You don't know how to answer a customer right away. What do you do?",best:"Tell them you'll find out and give a realistic time for your follow-up."},
      {category:"Customer service",question:"A customer is speaking angrily. What do you do?",best:"Keep your voice calm, listen, and focus on understanding the problem."},
      {category:"Customer service",question:"A customer reports a problem that may be outside your role. What do you do?",best:"Explain that you'll connect them with the right person and make the handoff clear."},
      {category:"Customer service",question:"You discover you gave a customer incorrect information. What do you do?",best:"Correct the information promptly and apologize for the confusion."},
      {category:"Customer service",question:"A customer asks for an update before you have one. What do you do?",best:"Give an honest update and tell them when you expect to know more."},
      {category:"Customer service",question:"A customer has a request that conflicts with company policy. What do you do?",best:"Explain the policy politely and offer any allowed alternatives."},
      {category:"Customer service",question:"A customer thanks you for helping them. What do you do?",best:"Respond warmly and make sure they have what they need before ending the conversation."},

      // Professionalism (61–70)
      {category:"Professionalism",question:"You realize you will arrive late to work. What do you do?",best:"Notify the appropriate person as early as possible and give your estimated arrival time."},
      {category:"Professionalism",question:"You make a mistake that affects your team's work. What do you do?",best:"Take responsibility, explain what happened, and help correct it."},
      {category:"Professionalism",question:"A coworker shares private information about someone else. What do you do?",best:"Avoid spreading it and keep the conversation respectful and work-appropriate."},
      {category:"Professionalism",question:"You receive a work message that sounds frustrating. What do you do?",best:"Pause, check the facts, and reply calmly and professionally."},
      {category:"Professionalism",question:"You finish a shift but still have an unfinished handoff. What do you do?",best:"Tell the right teammate what is unfinished and what needs attention next."},
      {category:"Professionalism",question:"You aren't sure what the workplace dress expectations are. What do you do?",best:"Ask your manager or check the workplace guidance."},
      {category:"Professionalism",question:"You are asked to do something that seems unsafe. What do you do?",best:"Pause the task and speak with your manager or safety contact."},
      {category:"Professionalism",question:"You cannot attend a meeting you accepted. What do you do?",best:"Tell the organizer promptly and share any update they need from you."},
      {category:"Professionalism",question:"You see a coworker being treated disrespectfully. What do you do?",best:"Support respectful behavior and raise the concern through an appropriate channel."},
      {category:"Professionalism",question:"You are unsure whether a work document can be shared externally. What do you do?",best:"Check the sharing rules or ask an authorized person before sending it."},

      // Adaptability (71–80)
      {category:"Adaptability",question:"Your team changes the plan halfway through a project. What do you do?",best:"Confirm the new goal and adjust your next steps."},
      {category:"Adaptability",question:"You are assigned a task you haven't done before. What do you do?",best:"Ask about the expected result, then learn the steps and try."},
      {category:"Adaptability",question:"A new tool replaces one you already know. What do you do?",best:"Learn the new tool using available guidance and ask focused questions."},
      {category:"Adaptability",question:"Your usual way of doing a task is no longer working. What do you do?",best:"Ask what has changed and adapt your approach to the current requirements."},
      {category:"Adaptability",question:"A teammate asks you to switch tasks to help with an urgent need. What do you do?",best:"Check priorities with the relevant person and agree on what to pause."},
      {category:"Adaptability",question:"You receive a last-minute change to a presentation. What do you do?",best:"Confirm the most important changes and update those first."},
      {category:"Adaptability",question:"You are moved to a different team for a short project. What do you do?",best:"Learn the team's goals, roles, and preferred way of communicating."},
      {category:"Adaptability",question:"Your first attempt at a new task doesn't go well. What do you do?",best:"Ask what to improve, learn from the attempt, and try again."},
      {category:"Adaptability",question:"A sudden change affects your planned workday. What do you do?",best:"Recheck your priorities and tell people who may be affected."},
      {category:"Adaptability",question:"You need to work with someone whose style is different from yours. What do you do?",best:"Ask how they prefer to coordinate and agree on a clear way to work together."},

      // Meetings (81–90)
      {category:"Meetings",question:"You are invited to a meeting but don't know why you are needed. What do you do?",best:"Ask what the meeting is for and whether you should prepare anything."},
      {category:"Meetings",question:"You have an idea but are nervous about speaking in a meeting. What do you do?",best:"Wait for a suitable pause and share your idea briefly."},
      {category:"Meetings",question:"You disagree with a point raised in a meeting. What do you do?",best:"Share your concern respectfully and explain the reason behind it."},
      {category:"Meetings",question:"The meeting is ending, but you aren't clear about your action item. What do you do?",best:"Ask who owns the task and when it is due before the meeting ends."},
      {category:"Meetings",question:"You are leading a short team meeting. What do you do first?",best:"State the goal and the topics you need to cover."},
      {category:"Meetings",question:"A discussion moves away from the meeting goal. What do you do?",best:"Politely bring the conversation back to the main topic."},
      {category:"Meetings",question:"You cannot answer a question during a meeting. What do you do?",best:"Say you will check the information and follow up by an agreed time."},
      {category:"Meetings",question:"You will arrive late to an online meeting. What do you do?",best:"Message the organizer and join quietly when you can."},
      {category:"Meetings",question:"You want to remember the decisions from a meeting. What do you do?",best:"Write down the decisions, owners, and deadlines."},
      {category:"Meetings",question:"A meeting ends without a clear decision. What do you do?",best:"Ask what decision is needed, who will make it, and by when."},

      // Learning and initiative (91–100)
      {category:"Learning",question:"You have a quiet moment after finishing your assigned tasks. What do you do?",best:"Ask your manager what useful task or skill you should focus on next."},
      {category:"Learning",question:"You want to learn a skill that would help your job. What do you do?",best:"Tell your manager which skill you want to learn and ask for a practical way to practice."},
      {category:"Learning",question:"You see a process that could be improved. What do you do?",best:"Describe the problem and suggest a small change for the team to consider."},
      {category:"Learning",question:"You are new and unsure who handles a certain issue. What do you do?",best:"Check the team guidance or ask your manager who owns that area."},
      {category:"Learning",question:"You finish a task and want to improve next time. What do you do?",best:"Review what went well and choose one thing to improve."},
      {category:"Learning",question:"You are asked to use a spreadsheet feature you don't know. What do you do?",best:"Use approved learning resources and ask for help if you get stuck."},
      {category:"Learning",question:"You notice a helpful resource that could save your team time. What do you do?",best:"Share it with the team and explain how it could help."},
      {category:"Learning",question:"You want more responsibility at work. What do you do?",best:"Ask your manager about a suitable next task and what skills it requires."},
      {category:"Learning",question:"You are unsure whether your work meets expectations. What do you do?",best:"Ask for an example of a good result and compare your work against it."},
      {category:"Learning",question:"You want to build confidence doing a task independently. What do you do?",best:"Confirm the goal, try the task, and ask for feedback afterward."}
    ].map((question, index) => ({ ...question, id: index }));

    const ROUND_SIZE = 10;

    const distractors = [
      "Ignore the issue and hope it goes away.",
      "Blame someone else without checking the facts.",
      "Make a guess and avoid telling anyone.",
      "React defensively before hearing the full situation.",
      "Promise a result before checking whether it's possible."
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let roundQuestions = [];
    let questionDeck = [];
    let lastRoundIds = [];

    const gameArea = document.getElementById("gameArea");
    const scoreLabel = document.getElementById("scoreLabel");
    const progressBar = document.getElementById("progressBar");

    function shuffle(list) {
      const result = [...list];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function sameSet(a, b) {
      return [...a].sort((x, y) => x - y).join(",") ===
             [...b].sort((x, y) => x - y).join(",");
    }

    function drawRound() {
      const batch = [];

      while (batch.length < ROUND_SIZE) {
        if (questionDeck.length === 0) {
          questionDeck = shuffle(questionBank);

          while (
            lastRoundIds.length === ROUND_SIZE &&
            sameSet(
              questionDeck.slice(0, ROUND_SIZE).map(q => q.id),
              lastRoundIds
            )
          ) {
            questionDeck = shuffle(questionBank);
          }
        }

        batch.push(questionDeck.shift());
      }

      lastRoundIds = batch.map(q => q.id);

      return batch.map(question => {
        const options = [
          { text: question.best, correct: true },
          ...shuffle(distractors)
            .slice(0, 2)
            .map(text => ({ text, correct: false }))
        ];

        const choices = shuffle(options);

        return {
          ...question,
          choices,
          correctIndex: choices.findIndex(choice => choice.correct)
        };
      });
    }

    function startNewGame() {
      currentQuestion = 0;
      score = 0;
      roundQuestions = drawRound();
      showQuestion();
    }

    function showQuestion() {
      answered = false;

      const item = roundQuestions[currentQuestion];

      scoreLabel.textContent = `Score: ${score}`;
      progressBar.style.width =
        `${(currentQuestion / roundQuestions.length) * 100}%`;

      gameArea.innerHTML = `
        <span class="tag">
          ${item.category} · Challenge ${currentQuestion + 1} of ${roundQuestions.length}
        </span>
        <h2>${item.question}</h2>
        <div class="choices">
          ${item.choices.map((choice, index) =>
            `<button class="choice" onclick="chooseAnswer(${index})">${choice.text}</button>`
          ).join("")}
        </div>
        <div class="feedback" id="feedback"></div>
        <button class="next" id="nextButton" onclick="nextQuestion()" hidden>
          ${currentQuestion === roundQuestions.length - 1
            ? "See my result"
            : "Next challenge"}
        </button>
      `;
    }

    function chooseAnswer(selected) {
      if (answered) return;
      answered = true;

      const item = roundQuestions[currentQuestion];
      const buttons = document.querySelectorAll(".choice");

      buttons.forEach((button, index) => {
        button.disabled = true;

        if (index === item.correctIndex) {
          button.classList.add("correct");
        }

        if (index === selected && selected !== item.correctIndex) {
          button.classList.add("wrong");
        }
      });

      const isCorrect = selected === item.correctIndex;

      if (isCorrect) {
        score++;
        scoreLabel.textContent = `Score: ${score}`;
      }

      const feedback = document.getElementById("feedback");

      feedback.innerHTML = isCorrect
        ? "<strong>Good choice!</strong> That is a professional way to handle the situation."
        : `<strong>Not quite.</strong> A stronger response would be: ${item.best}`;

      feedback.classList.add("show");
      document.getElementById("nextButton").hidden = false;
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < roundQuestions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      progressBar.style.width = "100%";
      scoreLabel.textContent =
        `Final score: ${score}/${roundQuestions.length}`;

      let message = "Keep practicing—you’ll get more confident with every round.";

      if (score === roundQuestions.length) {
        message = "Excellent work! You handled every challenge thoughtfully.";
      } else if (score >= Math.ceil(roundQuestions.length / 2)) {
        message = "Nice job! Keep practicing to build your workplace skills.";
      }

      gameArea.innerHTML = `
        <div class="result">
          <span class="tag">CHALLENGE COMPLETE</span>
          <h2>Your workplace-ready score</h2>
          <div class="big-score">${score} / ${roundQuestions.length}</div>
          <p>${message}</p>
          <button class="restart" onclick="startNewGame()">Play again</button>
        </div>
      `;
    }

    startNewGame();
  </script>
</body>
</html>
